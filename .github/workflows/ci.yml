name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: seat_reservation_test
          POSTGRES_USER: seat
          POSTGRES_PASSWORD: seat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seat -d seat_reservation_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://seat:seat_test@127.0.0.1:5432/seat_reservation_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: docker build .
